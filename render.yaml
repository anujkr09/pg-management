services:
  - type: web
    name: pg-management
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pghostel
      - key: DB_MODE
        value: app_state
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TENANT_PASSWORD
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: BACKUP_INTERVAL_HOURS
        value: 24
